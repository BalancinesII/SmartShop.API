# Pings the API's /health endpoint so the free App Service doesn't unload
# after ~20 minutes idle (Always On isn't available on the Free tier).
# /health doesn't touch the database, so Azure SQL can still pause and
# the free tier's vCore-seconds aren't spent.
#
# Note: GitHub may delay scheduled runs by a few minutes, and it disables
# scheduled workflows after 60 days without activity in the repo.

name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://smartshop-api-nachosaiz-d2fvhhgfgwdkc5cc.swedencentral-01.azurewebsites.net/health
